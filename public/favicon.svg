<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="SEO Preview Tool">
  <!-- Abstract search result: a blue title line above two grey snippet lines.
       Deliberately simple, because this is mostly seen at 16px in a browser tab. -->
  <rect width="32" height="32" rx="7" fill="#1a0dab"/>
  <rect x="7"  y="9"  width="14" height="3.4" rx="1.7" fill="#ffffff"/>
  <rect x="7"  y="16" width="18" height="2.6" rx="1.3" fill="#ffffff" opacity="0.62"/>
  <rect x="7"  y="21" width="11" height="2.6" rx="1.3" fill="#ffffff" opacity="0.62"/>
</svg>
